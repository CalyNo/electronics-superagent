# ============================================================================
# 分类扩展：项目专属的文档类型、命名例外与路径映射
#
# 全局类型表见 docs/03-资产分类规范.md §3.2。本文件只做【追加】，
# 不允许重定义全局类型或改变其阶段归属。
# ============================================================================

code: {{CODE}}

# ---------------------------------------------------------------------------
# 项目专属文档类型（全局表不含、但本项目必须有的）
# ---------------------------------------------------------------------------
docTypes:
  - code: TSPEC
    name: 测试规格书
    stage: S4
    template: 06-设计验证计划
    path: docs/S4-验证/TSPEC/
  - code: CAL
    name: 标定参数说明
    stage: S2
    template: 02-需求规格书
    path: docs/S2-产品设计/CAL/
  # 每新增一项都要: ①定 code ②绑模板 ③定路径 ④更新索引表头

# ---------------------------------------------------------------------------
# 命名规则（不得宽于全局规则）
# ---------------------------------------------------------------------------
naming:
  descriptionMaxChars: 20
  serialWidth: 3
  serialScope: project            # project | global
  allowChinese: true
  forbiddenChars: [' ', '_', '(', ')', '#', '@']

# ---------------------------------------------------------------------------
# 特殊特性编号
# ---------------------------------------------------------------------------
specialCharacteristics:
  prefixes: [CC, SC]              # CC 关键特性 / SC 重要特性
  format: "{{CODE}}-{prefix}-{nn}"
  example: "{{CODE}}-CC-03"
  requireControlPlan: true        # 每个特殊特性必须有对应控制计划条目

# ---------------------------------------------------------------------------
# 路径例外：极少数情况下全局路径规则不适用
# ---------------------------------------------------------------------------
paths:
  overrides: []
  # - asset: DOC-S4-TSPEC
  #   path: docs/S4-验证/TSPEC/
  #   reason: 客户要求测试规格书独立成册
