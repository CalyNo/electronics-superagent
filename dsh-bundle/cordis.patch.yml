# electronics-superagent 的 DSH/Cordis 装配层。
# 由 bundle 声明，dsh --profile electronics 时按 dsh.profile.bundles 顺序装载。
#
# 两个插入项：
#   1. electronics-superagent       —— 宿主插件，持有引擎/面板，注入 DSH agent 作为固件修改后端
#   2. software-engineer preset     —— 接收原文和需求，返回候选源码
- insert:
    - id: electronics-superagent
      name: '@local/electronics-superagent'
      config:
        projectDir: !!js process.env.SUPERAGENT_PROJECT_DIR || ''
        skillsDir: !!js process.env.SUPERAGENT_SKILLS_DIR || ''
        source: !!js process.env.SUPERAGENT_SOURCE || 'local'
        panel: true
        host: 127.0.0.1
        port: 8787
        intervalMs: 1500
        codePresetId: software-engineer

    - id: preset-software-engineer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: software-engineer
        name: 软件工程师
        description: 根据需求和原文生成固件应用层候选源文件
        order: 88
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是电子超体的嵌入式软件工程师。根据给出的原始源码和工单全文生成完整候选文件。
                采用最小改动并保留项目风格。缺少关键上下文时，以 BLOCKED: 开头说明缺少的信息。
